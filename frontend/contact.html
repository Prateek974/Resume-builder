<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
   <form>
    <label for="fname">First name<sub>(required)</sub></label>
    <input type="text" id="fname" name="fname"><br>
    <label for="lname">Last name <sub>(required)</sub></label>
    <input type="text" id="lname" name="lname"><br>
   
    <label for="email">Email <sub>(required)</sub></label>
    <input type="email" id="email" name="email"><br>
   <label for="Phone">Phone Number<sub>(required)</sub></label>
    <input type="number" id="Phone" name="Phone"><br>
   <label for="message">Message<sub>(required)</sub></label>
    <input type="text" id="message" name="message"><br>
    <input type="submit" value="Submit">
   </form>
</body>
</html>
